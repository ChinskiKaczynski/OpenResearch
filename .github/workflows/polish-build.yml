name: Polish UI build and Windows installer

on:
  push:
    branches: [i18n/polish]
    paths:
      - "ui/messages/pl.json"
      - "ui/project.inlang/settings.json"
      - "ui/src/**"
      - "ui/index.html"
      - ".github/workflows/polish-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-ui:
    name: Validate and regenerate UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install locked dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Check localization catalog
        working-directory: ui
        run: pnpm lint:i18n
      - name: Run UI tests
        working-directory: ui
        run: pnpm test
      - name: Compile and bundle UI
        working-directory: ui
        run: pnpm build
      - name: Commit generated assets to localization branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ui/dist
          if ! git diff --cached --quiet; then
            git commit -m "build(ui): regenerate bundled assets for Polish"
            git push origin HEAD:refs/heads/i18n/polish
          else
            echo "UI bundle is already up to date."
          fi

  windows-installer:
    name: Build Polish Windows installer
    needs: polish-ui
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/polish
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile orx and launcher
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path windows/launcher/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create OpenResearch Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-staging | Out-Null
          Copy-Item windows/launcher/target/release/OpenResearch.exe, target/release/orx.exe app-staging
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\app-staging" "/DOutputDir=$PWD\app-installer" windows\OpenResearch.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenResearch-Polski-Setup
          path: app-installer/OpenResearch-Setup.exe
          if-no-files-found: error
